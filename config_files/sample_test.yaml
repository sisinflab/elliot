experiment:
  dataset: movielens_1m_v030
  # Optional W&B integration: leave absent (or commented) to disable.
  # Put WANDB_API_KEY in a local .env file (ignored by git), e.g.:
  # WANDB_API_KEY=your_wandb_api_key_here
  wandb:
     project: "Elliot-experiments"
     run_name: "movielens_1m"
  device: cpu
  data_config:
    strategy: hierarchy
    data_folder: ../data/{0}/splitting
  top_k: 20
  evaluation:
    simple_metrics: [nDCG, HR]
  models:
    ItemKNN:
      meta:
        save_recs: False
      neighborhood: 500
      similarity: rp3beta
      alpha: 1.0
      beta: 0.6
      normalize_similarity: True
      eval_batch_size: 2048
